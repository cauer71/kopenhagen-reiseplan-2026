name: Deploy Reiseplan to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Reisedaten prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Reisedaten validieren
        run: python3 tools/validate_trips.py

      # Braucht Netz und darf deshalb nicht blockieren: ein langsamer
      # Bildserver ist kein Grund, eine Planänderung nicht zu veröffentlichen.
      # Ein toter Link soll aber auffallen – vorher blieb an seiner Stelle
      # stillschweigend eine leere Fläche.
      - name: Bild-URLs prüfen (blockiert nicht)
        continue-on-error: true
        run: python3 tools/check_images.py

  deploy:
    name: Deploy
    # Kaputte Reisedaten dürfen nicht live gehen.
    needs: validate
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
