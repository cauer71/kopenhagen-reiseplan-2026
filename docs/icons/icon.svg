<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    App-Symbol: die oberste Marke aus dem Start-Intro — Abflug.

    Dies ist die Quelle; die PNG-Dateien daneben sind daraus gerastert. Wer das
    Symbol ändert, ändert diese Datei und erzeugt die PNGs neu.

    Die Marke füllt 76 % der Kachel. Das ist kein Zufall: Android beschneidet
    „maskable" Symbole auf die mittleren 80 %, und dasselbe 512er dient im
    Manifest für beide Zwecke. Der Rand bleibt deshalb frei.

    Die Glyphe ist flight_takeoff aus Material Symbols Rounded
    (github.com/google/material-design-icons, Apache License 2.0 — Lizenztext
    in MATERIAL-SYMBOLS-LICENSE.txt daneben). Sie zeichnet im Koordinatenfeld
    0 -960 960 960; die Transformation setzt sie mittig auf die Scheibe.
  -->
  <rect width="512" height="512" fill="#f8f1e5"/>
  <circle cx="256" cy="256" r="187" fill="none" stroke="#14777c" stroke-opacity="0.45" stroke-width="15"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#fffaf0" stroke-width="19"/>
  <circle cx="256" cy="256" r="161" fill="#14777c"/>
