<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meine Reisen</title>
    <meta name="description" content="Bildstarke Reisepläne für mehrere Reisen – mit Tagesabschnitten, Ortsbeschreibungen und Offline-Zugriff." />
    <meta name="theme-color" content="#14777c" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Meine Reisen" />
    <meta property="og:title" content="Meine Reisen" />
    <meta property="og:description" content="Bildstarke Reisepläne für mehrere Reisen – mit Tagesabschnitten, Ortsbeschreibungen und Offline-Zugriff." />
    <meta property="og:url" content="https://cauer71.github.io/reiseplan/" />
    <!-- Bewusst das eigene Symbol und kein Reisebild: die Übersicht gehört keiner
         Reise. Vorher stand hier das Kolosseum – nach dem Löschen von Rom hätte die
         Vorschau eines geteilten Links auf ein Bild gezeigt, das die Seite nicht
         mehr benutzt. Die Reiseseiten holen ihr Vorschaubild aus der Reisedatei. -->
    <meta property="og:image" content="https://cauer71.github.io/reiseplan/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" />
    <!-- Apple: als Web App auf dem Home-Bildschirm.
         `apple-mobile-web-app-title` ist nötig, weil app.js document.title auf den
         vollen Reisetitel setzt – iOS nähme sonst den und kürzte ihn hart ab.
         `mobile-web-app-capable` ist die heutige Schreibweise, die apple-Variante
         bleibt für iOS vor 16.4, wo das Manifest-`display` noch nicht griff. -->
    <meta name="apple-mobile-web-app-title" content="Reiseplan" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <script type="module" src="./assets/landing.js"></script>
  </body>
</html>
